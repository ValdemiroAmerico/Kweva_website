name: Publish GitHub Pages

# Publication is started explicitly from Actions, after reviewing the site.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure public URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Pages can report an HTTP base URL before HTTPS enforcement is enabled.
          # Keep generated canonical URLs and sitemap entries on HTTPS.
          case "$SITE_URL" in
            http://*) SITE_URL="https://${SITE_URL#http://}" ;;
          esac
          python3 scripts/configure-site.py --url "$SITE_URL"
      - name: Check local pages and resources
        run: python3 scripts/check-site.py
      - name: Test clean URLs
        run: python3 scripts/test-clean-urls.py
      - name: Build public files
        run: python3 scripts/build-static.py
      - name: Check published routes and assets
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check-published.py _site --base-path "$SITE_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
